server {
    listen       __PORT__;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip             on;
    gzip_comp_level  6;
    gzip_vary        on;
    gzip_types       text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
    gzip_min_length  256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- hashed build assets ----------
    # Vite content-hashes everything under /assets, so a URL never changes
    # meaning. add_header in a location replaces the server-level ones, so the
    # security headers are repeated wherever a location sets its own.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- files that must never be stale ----------
    # runtime-config.js changes with every redeploy under the same name; sw.js
    # must be re-checked or a broken service worker could stick around.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- search engines and AI agents ----------
    # The sitemap lists every product page, so it comes from the API. If the API can't be
    # reached, the static one in the image (home page only) is served instead.
    location = /sitemap.xml {
        proxy_pass __API_UPSTREAM__/api/seo/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @static_sitemap;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @static_sitemap {
        try_files /sitemap-static.xml =404;
        default_type application/xml;
    }

    # Product page <head> tags, fetched from the API by the SSI include in index.html. Only
    # reachable as that subrequest. Any failure returns an empty body, so the page falls back
    # to the home page's tags instead of breaking.
    location ^~ /__seo/p/ {
        internal;
        proxy_pass __API_UPSTREAM__/api/seo/product/;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @seo_empty;
    }
    location ^~ /__seo/ {
        internal;
        return 204;
    }

    # The visible top of a product page (photo, name, price), so it shows before the app loads.
    # Same fallback: an empty body, and the page waits for the app as before.
    location ^~ /__body/p/ {
        internal;
        proxy_pass __API_UPSTREAM__/api/seo/product-body/;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @seo_empty;
    }
    location ^~ /__body/ {
        internal;
        return 204;
    }
    location @seo_empty {
        return 204;
    }

    # Files that don't exist must be real 404s, never the app shell: crawlers and AI agents
    # (robots.txt, llms.txt, /.well-known/*) treat a 200 HTML page as a broken file.
    location ^~ /.well-known/ {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- static files ----------
    # A missing icon/image must be a real 404, not the HTML app shell: Google,
    # Instagram, WhatsApp etc. fetch /favicon.ico and og-image directly and
    # show a "?" icon when they get HTML back.
    location ~* \.(ico|png|jpe?g|gif|webp|avif|svg|txt|xml|json|webmanifest|woff2?|map)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- single-page app ----------
    # Shop pages (/, /p/<product>) and the admin panel (/#admin) are all the app shell. SSI
    # fills in each product page's title, description, structured data and visible top part
    # (see index.html and scripts/prerender.mjs).
    location / {
        try_files $uri $uri/ /index.html;
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
