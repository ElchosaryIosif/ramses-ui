server {
    listen       __PORT__;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip             on;
    gzip_comp_level  6;
    gzip_vary        on;
    gzip_types       text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;
    gzip_min_length  256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- hashed build assets ----------
    # Vite content-hashes everything under /assets, so a URL never changes
    # meaning. add_header in a location replaces the server-level ones, so the
    # security headers are repeated wherever a location sets its own.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- files that must never be stale ----------
    # runtime-config.js changes with every redeploy under the same name; sw.js
    # must be re-checked or a broken service worker could stick around.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- static files ----------
    # A missing icon/image must be a real 404, not the HTML app shell: Google,
    # Instagram, WhatsApp etc. fetch /favicon.ico and og-image directly and
    # show a "?" icon when they get HTML back.
    location ~* \.(ico|png|jpe?g|gif|webp|svg|txt|xml|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---------- single-page app ----------
    # The admin panel is /#admin, so every path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
