<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Search and link-preview tags. nginx (SSI) replaces this block on product pages with the
      product's own tags from the API; everywhere else, and in `npm run dev`, these are used.
    -->
    <!--# block name="seo_home" -->
    <title>Ramses Bazaar — Boho & Ethnic Gift Store | Καλαμάτα</title>
    <meta name="description" content="Ramses Bazaar, Καλαμάτα, από το 1996: boho, ethnic και hippie κοσμήματα, ρούχα, home decor, θυμιάματα και collectibles από τη Μέση Ανατολή, την Αίγυπτο και όλο τον κόσμο. Στοά Λόντου 1." />
    <meta name="keywords" content="ramses bazaar, kalamata, καλαμάτα, boho, ethnic, hippie, κοσμήματα, ρούχα, θυμιάματα, αιγυπτιακά, egyptian, middle east, gift store, στοά λόντου" />
    <meta property="og:title" content="Ramses Bazaar — Boho & Ethnic | Καλαμάτα" />
    <meta property="og:description" content="Gift store από το 1996 στη Στοά Λόντου, Καλαμάτα. Κοσμήματα, ρούχα, home decor και θυμιάματα από τη Μέση Ανατολή, την Αίγυπτο και όλο τον κόσμο." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:site_name" content="Ramses Bazaar" />
    <meta property="og:url" content="https://ramsesbazaar.com/" />
    <!-- Link preview picture for Instagram, WhatsApp, Facebook, Viber… Must be an absolute URL. -->
    <meta property="og:image" content="https://ramsesbazaar.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://ramsesbazaar.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ramses Bazaar — Boho, Ethnic, Hippie gift store in Kalamata since 1996" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramses Bazaar — Boho & Ethnic | Καλαμάτα" />
    <meta name="twitter:description" content="Gift store από το 1996 στη Στοά Λόντου, Καλαμάτα. Κοσμήματα, ρούχα, home decor και θυμιάματα από τη Μέση Ανατολή, την Αίγυπτο και όλο τον κόσμο." />
    <meta name="twitter:image" content="https://ramsesbazaar.com/og-image.jpg" />
    <link rel="canonical" href="https://ramsesbazaar.com/" />
    <!--# endblock -->
    <!--# include virtual="/__seo$request_uri" stub="seo_home" -->
    <!-- docker-entrypoint.sh replaces this with preconnect/preload hints for the API. -->
    <!--api-hints-->
    <meta name="theme-color" content="#18100A" />
    <!-- Site icon for browser tabs, Google results and link previews. Google needs a square multiple of 48px. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Installable as a home-screen app (Android/Chrome + iOS Safari) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ramses Bazaar" />

    <!-- Lets Google show the shop's name, logo, address and hours in results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Ramses Bazaar",
        "url": "https://ramsesbazaar.com/",
        "logo": "https://ramsesbazaar.com/icon-512.png",
        "image": "https://ramsesbazaar.com/og-image.jpg",
        "description": "Gift store στην Καλαμάτα από το 1996 — boho, ethnic και hippie κοσμήματα, ρούχα, home decor και θυμιάματα από τη Μέση Ανατολή, την Αίγυπτο και όλο τον κόσμο.",
        "foundingDate": "1996",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Στοά Λόντου 1",
          "addressLocality": "Καλαμάτα",
          "postalCode": "24100",
          "addressCountry": "GR"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], "opens": "08:30", "closes": "14:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Tuesday", "Thursday", "Friday"], "opens": "18:00", "closes": "21:00" }
        ],
        "sameAs": ["https://www.instagram.com/ramsesbazaar", "https://www.facebook.com/RamsesBazaar"]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script>
      // #root holds a pre-rendered page top in Greek: the nav plus the home hero, or on a product
      // page the product (from the server). Keep it only where it matches what the app will show,
      // so other pages and visitors who chose another language never see it flash by.
      (function () {
        var root = document.getElementById('root');
        var path = location.pathname;
        var lang;
        try {
          lang = JSON.parse(localStorage.getItem('rb_lang_v2')).state.lang;
        } catch (e) {}
        var matches = path === '/' || (/^\/p\/[^/]+\/?$/.test(path) && root.querySelector('.product-page'));
        if (!matches || location.hash === '#admin' || (lang && lang !== 'gr')) {
          root.innerHTML = '';
        } else if (path === '/') {
          // Show the hero at once (no fade-in), both now and when the app takes over.
          document.documentElement.classList.add('handoff');
        }
      })();
    </script>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
